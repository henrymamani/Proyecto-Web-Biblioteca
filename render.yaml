databases:
  - name: biblioteca-sis-db
    plan: free
    databaseName: biblioteca_sis
    user: biblioteca_sis

services:
  - type: web
    name: biblioteca-sis
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn Biblioteca_sis.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-sis-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_OAUTH_ALLOWED_DOMAIN
        value: sistemas.edu.bo
